name: circuit-breaker
extends: machine
description: Stops sending to a failing backend for a cooldown, then lets one request probe it. Wire the backend's error output to 'failure'.
icon: fa-plug-circle-xmark
params:
  threshold: 5     # failures within one window that open the breaker
  window: 10.0     # how often the failure count resets while closed
  cooldown: 5.0    # how long to stay open before probing
machine: |
  inputs in, failure
  outputs out, rejected
  var failures = 0

  on failure: pass        # failure reports are absorbed in any state

  state closed:
    enter:
      failures = 0
      after window -> tick
    on in: send out
    on tick:
      failures = 0
      after window -> tick
    on failure:
      failures += 1
      if failures >= threshold:
        goto open

  state open:
    enter:
      count opened
      after cooldown -> probe
    on in: send rejected
    on probe: goto half_open

  state half_open:        # let one request through to test the backend
    on in:
      send out
      goto closed
    on failure: goto open
