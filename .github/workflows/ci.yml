name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # aihealth delta needs the base revision

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          # pinned like CLAUDE.md says (v0.4.0)
          uv tool install "git+https://github.com/epatel/ai-health@033d1867fe514867d944d9387ee72db0188eed47"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Base revision for aihealth delta
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          rev="${PR_BASE:-$BEFORE}"
          # a new branch's first push has no "before" (all zeros)
          if [[ -z "$rev" || "$rev" =~ ^0+$ ]] || ! git cat-file -e "$rev^{commit}" 2>/dev/null; then rev=""; fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Check
        run: scripts/check.sh "${{ steps.base.outputs.rev }}"
