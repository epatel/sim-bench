name: foxes
extends: machine
description: >
  A predator population. Each fox catches a rabbit at `hunt` x rabbits per time unit
  (using the last `census` it heard) and sends a message on `kill` for each catch. A
  catch feeds a new fox with probability `efficiency`. Each fox dies at `death` per
  time unit. Events are drawn one at a time (Gillespie), so foxes can die out.
icon: fa-paw
params:
  start: 20          # foxes at t=0
  hunt: 0.02         # catches per fox per rabbit per time unit
  efficiency: 0.1    # chance that a catch raises a new fox
  death: 0.4         # deaths per fox per time unit
machine: |
  inputs census
  outputs kill
  var foxes = -1
  var prey = 0            # rabbits in the last census
  var catching = 0        # rates of the next event, drawn on entering alive
  var dying = 0

  state born:
    enter:
      foxes = start
      goto alive
    on census: prey = msg.rabbits

  state alive:
    enter:
      observe foxes
      catching, dying = hunt * prey * foxes, death * foxes
      if foxes <= 0:
        goto extinct
      elif catching + dying > 0:
        after exponential(1 / (catching + dying)) -> act
    on census:
      prey = msg.rabbits
      goto alive          # the rates changed: draw the next event again
    on act:               # a catch or a death, in proportion to their rates
      if random() * (catching + dying) < catching:
        emit kill
        count catches
        if random() < efficiency:
          foxes += 1
          count births
      else:
        foxes -= 1
        count deaths
      goto alive

  state extinct:
    on census: prey = msg.rabbits
