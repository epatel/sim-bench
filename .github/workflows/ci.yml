name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# actions are pinned to commit SHAs (a moved tag can't change what runs);
# Dependabot (.github/dependabot.yml) proposes updates
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # aihealth delta needs the base revision
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Install
        run: |
          python -m venv .venv
          # The SDK's source package has no bundled Claude CLI (the wheel's is ~370 MB);
          # tests replay recorded CLI traffic and never start it.
          .venv/bin/pip install --no-binary claude-agent-sdk -r requirements-dev.txt
          # pinned like CLAUDE.md says (v0.4.0)
          uv tool install "git+https://github.com/epatel/ai-health@033d1867fe514867d944d9387ee72db0188eed47"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Base revision for aihealth delta
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          rev="${PR_BASE:-$BEFORE}"
          # a new branch's first push has no "before" (all zeros)
          if [[ -z "$rev" || "$rev" =~ ^0+$ ]] || ! git cat-file -e "$rev^{commit}" 2>/dev/null; then rev=""; fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Check
        run: scripts/check.sh "${{ steps.base.outputs.rev }}"
