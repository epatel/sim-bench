name: batcher
extends: machine
description: Collects messages and releases them together, when the batch is full or a timeout passes.
icon: fa-boxes-stacked
params:
  size: 10        # release when this many are waiting
  timeout: 2.0    # ...or this long after the first one arrived
machine: |
  var batch = []

  state empty:
    on in:
      push batch
      goto filling

  state filling:
    enter: after timeout -> flush
    on in:
      push batch
      if len(batch) >= size:
        goto releasing
    on flush: goto releasing

  state releasing:
    enter:
      observe batch_size = len(batch)
      release batch -> out
      goto empty
