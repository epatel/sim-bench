# sim-bench at /sim-bench/ (prefix stripped). The app uses page-relative URLs, so it
# needs no prefix setting. WebSockets for live runs and the agent: upgrade headers,
# no buffering, long timeouts (a run or an agent reply can be quiet for minutes).
# Needs a `map $http_upgrade $connection_upgrade` in the http block.
location = /sim-bench { return 302 /sim-bench/; }
location ^~ /sim-bench/ {
    include snippets/memention-proxy-headers.conf;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 60s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
    proxy_buffering off;
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:8780/;
}
